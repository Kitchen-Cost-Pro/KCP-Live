<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</helmet>
<section style="display:flex; flex-wrap:wrap; gap:64px; align-items:flex-start; padding:72px; background:#dfe3e8; font-family:'Hanken Grotesk',system-ui,sans-serif">

  <div id="3a" style="flex:0 0 auto">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px">
      <span style="display:inline-flex; align-items:center; justify-content:center; padding:5px 11px; background:#0a8f5b; color:#fff; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.04em">3a</span>
      <span style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.11em; text-transform:uppercase; color:#5a616d">Inventory system · Light</span>
    </div>
    <dc-import name="ReportView3" theme="light" show-view-tabs="{{ showViewTabs }}" hint-size="1440px,1100px"></dc-import>
  </div>

  <div id="3b" style="flex:0 0 auto">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px">
      <span style="display:inline-flex; align-items:center; justify-content:center; padding:5px 11px; background:#0a8f5b; color:#fff; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.04em">3b</span>
      <span style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.11em; text-transform:uppercase; color:#5a616d">Inventory system · Dark</span>
    </div>
    <dc-import name="ReportView3" theme="dark" show-view-tabs="{{ showViewTabs }}" hint-size="1440px,1100px"></dc-import>
  </div>

  <div style="flex-basis:100%; height:0"></div>

  <div id="2a" style="flex:0 0 auto">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px">
      <span style="display:inline-flex; align-items:center; justify-content:center; padding:5px 11px; background:#2f6bff; color:#fff; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.04em">2a</span>
      <span style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.11em; text-transform:uppercase; color:#5a616d">Command rail · Light</span>
    </div>
    <dc-import name="ReportView2" theme="light" hint-size="1440px,900px"></dc-import>
  </div>

  <div id="2b" style="flex:0 0 auto">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px">
      <span style="display:inline-flex; align-items:center; justify-content:center; padding:5px 11px; background:#2f6bff; color:#fff; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.04em">2b</span>
      <span style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.11em; text-transform:uppercase; color:#5a616d">Command rail · Dark</span>
    </div>
    <dc-import name="ReportView2" theme="dark" hint-size="1440px,900px"></dc-import>
  </div>

  <div style="flex-basis:100%; height:0"></div>

  <div id="1a" style="flex:0 0 auto">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px">
      <span style="display:inline-flex; align-items:center; justify-content:center; padding:5px 11px; background:#0f1319; color:#fff; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.04em">1a</span>
      <span style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.11em; text-transform:uppercase; color:#5a616d">Light</span>
    </div>
    <dc-import name="ReportView" theme="light" hint-size="1360px,1220px"></dc-import>
  </div>

  <div id="1b" style="flex:0 0 auto">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px">
      <span style="display:inline-flex; align-items:center; justify-content:center; padding:5px 11px; background:#0f1319; color:#fff; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.04em">1b</span>
      <span style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.11em; text-transform:uppercase; color:#5a616d">Dark</span>
    </div>
    <dc-import name="ReportView" theme="dark" hint-size="1360px,1220px"></dc-import>
  </div>

</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showViewTabs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Inventory table (3a / 3b)&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { showViewTabs: this.props.showViewTabs ?? false };
  }
}
</script>
</body>
</html>
