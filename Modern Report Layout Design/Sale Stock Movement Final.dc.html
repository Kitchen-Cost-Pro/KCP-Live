<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<div style="min-height:100vh; box-sizing:border-box; padding:56px; background:#dfe3e8; font-family:'Hanken Grotesk',system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; gap:56px">

  <div style="width:1440px; max-width:100%">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px">
      <span style="display:inline-flex; align-items:center; justify-content:center; padding:5px 11px; background:#0a8f5b; color:#fff; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.04em">3a</span>
      <span style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.11em; text-transform:uppercase; color:#5a616d">Light</span>
    </div>
    <dc-import name="ReportView3" theme="light" hint-size="1440px,900px"></dc-import>
  </div>

  <div style="width:1440px; max-width:100%">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px">
      <span style="display:inline-flex; align-items:center; justify-content:center; padding:5px 11px; background:#0a8f5b; color:#fff; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.04em">3b</span>
      <span style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.11em; text-transform:uppercase; color:#5a616d">Dark</span>

</div>
