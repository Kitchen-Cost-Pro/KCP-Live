name: Sync Worker Secrets to Cloudflare

# Manual-only, on purpose: Worker secrets are set once (or whenever you rotate one) and then
# persist on Cloudflare's side — they should NOT be re-pushed on every deploy. Run this from the
# Actions tab ("Run workflow") after adding or changing a secret below in your repo's
# Settings -> Secrets and variables -> Actions.
#
# Any secret left empty/unset in GitHub is simply skipped (not written), so you only need to add
# the ones your workspace actually uses (e.g. skip GMAIL_* / GDRIVE_* entirely if you don't use
# those integrations).

on:
  workflow_dispatch: {}

jobs:
  sync-secrets:
    name: Push secrets to Cloudflare Worker
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: cloudflare-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cloudflare-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Push secrets that are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ADMIN_TURNSTILE_SECRET_KEY: ${{ secrets.ADMIN_TURNSTILE_SECRET_KEY }}
          YOCO_KEY_ENCRYPTION_SECRET: ${{ secrets.YOCO_KEY_ENCRYPTION_SECRET }}
          YOCO_WEBHOOK_SECRET: ${{ secrets.YOCO_WEBHOOK_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_TOKEN_ENCRYPTION_SECRET: ${{ secrets.GMAIL_TOKEN_ENCRYPTION_SECRET }}
          GMAIL_OAUTH_STATE_SECRET: ${{ secrets.GMAIL_OAUTH_STATE_SECRET }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN_ENCRYPTION_SECRET: ${{ secrets.GDRIVE_TOKEN_ENCRYPTION_SECRET }}
          GDRIVE_OAUTH_STATE_SECRET: ${{ secrets.GDRIVE_OAUTH_STATE_SECRET }}
        run: |
          set -euo pipefail
          push_secret() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "Skipping $name (not set in GitHub Secrets)"
              return
            fi
            echo "Setting $name..."
            printf '%s' "$value" | node ./node_modules/wrangler/bin/wrangler.js secret put "$name"
          }

          push_secret "TURNSTILE_SECRET_KEY" "$TURNSTILE_SECRET_KEY"
          push_secret "ADMIN_TURNSTILE_SECRET_KEY" "$ADMIN_TURNSTILE_SECRET_KEY"
          push_secret "YOCO_KEY_ENCRYPTION_SECRET" "$YOCO_KEY_ENCRYPTION_SECRET"
          push_secret "YOCO_WEBHOOK_SECRET" "$YOCO_WEBHOOK_SECRET"
          push_secret "GMAIL_CLIENT_ID" "$GMAIL_CLIENT_ID"
          push_secret "GMAIL_CLIENT_SECRET" "$GMAIL_CLIENT_SECRET"
          push_secret "GMAIL_TOKEN_ENCRYPTION_SECRET" "$GMAIL_TOKEN_ENCRYPTION_SECRET"
          push_secret "GMAIL_OAUTH_STATE_SECRET" "$GMAIL_OAUTH_STATE_SECRET"
          push_secret "GDRIVE_CLIENT_ID" "$GDRIVE_CLIENT_ID"
          push_secret "GDRIVE_CLIENT_SECRET" "$GDRIVE_CLIENT_SECRET"
          push_secret "GDRIVE_TOKEN_ENCRYPTION_SECRET" "$GDRIVE_TOKEN_ENCRYPTION_SECRET"
          push_secret "GDRIVE_OAUTH_STATE_SECRET" "$GDRIVE_OAUTH_STATE_SECRET"
