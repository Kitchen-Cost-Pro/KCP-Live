# KCP production API — shared D1 control plane with one SQLite Durable Object per workspace.
account_id = "cfd7b868a65d660879a7b8597fb15676"
name = "kcp-api-v2"
main = "src/index.ts"
compatibility_date = "2026-05-23"


# Resolve shared export dependencies from this Worker package.
[alias]
xlsx = "./node_modules/xlsx/xlsx.mjs"
jspdf = "./node_modules/jspdf/dist/jspdf.es.min.js"
jspdf-autotable = "./node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.mjs"

# --- Durable Objects: one WorkspaceDO (SQLite) per workspace -------------------------------------
[[durable_objects.bindings]]
name = "WORKSPACE"
class_name = "WorkspaceDO"

[[durable_objects.bindings]]
name = "YOCO_V2_RATE_GATE"
class_name = "YocoV2RateGateDO"

[[durable_objects.bindings]]
name = "YOCO_V2_WRITE_BUDGET"
class_name = "YocoV2WriteBudgetDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceDO"]

[[migrations]]
tag = "v2-yoco-rate-gate"
new_sqlite_classes = ["YocoV2RateGateDO"]

[[migrations]]
tag = "v3-yoco-write-budget"
new_sqlite_classes = ["YocoV2WriteBudgetDO"]

# --- Cron triggers: TEMPORARILY DISABLED for DO read/write investigation (2026-08-20) -------------
# See CRON_BACKUP_RESTORE.md in this directory for what fired here, why it was removed, and the
# exact steps to restore it once the DO read/write root cause is confirmed fixed.
[triggers]
crons = []

# --- Central plane: shared D1 for identity / registry / members / cross-tenant coordination ------
[[d1_databases]]
binding = "CENTRAL_DB"
database_name = "kcp_central"
database_id = "279a7882-ca9d-4bae-b308-e47fe6d24071"

[vars]
ENVIRONMENT = "production"
# Emergency kill switch (2026-08-27). Set to "true" to stop WorkspaceDO attempting ANY pending
# migration on wake-up; safe at any time, since a workspace with pending migrations simply keeps
# serving on its existing schema. Left "false" because the two causes behind the incident it was
# added for are now fixed at source: migrate() applies at most ONE migration per invocation
# (never a whole backlog in one request), and migration 33's dedupe is a single-pass rollup rather
# than a quadratic correlated-subquery UPDATE. Migration 37 also has to run for the new hot-path
# indexes to exist, so leaving this "true" would hold back part of the fix. If the row-read quota
# is still exhausted when this deploys, migrations fail fast and back off on their own, then apply
# cleanly once the daily quota resets — no manual step needed. Flip to "true" only as an emergency.
WORKSPACE_MIGRATIONS_DISABLED = "false"
ALLOWED_ORIGINS = "http://localhost:*,http://127.0.0.1:*,https://kcp-live.pages.dev,https://*.kcp-live.pages.dev"
ADMIN_BOOTSTRAP_EMAILS = "superuser@yoco.com"
APP_BASE_URL = "https://kcp-live.pages.dev"
# Integration callback and webhook base URLs:
YOCO_WEBHOOK_BASE_URL = "https://kcp-api-v2.adminkitchencostpro.workers.dev"
GMAIL_OAUTH_REDIRECT_URI = "https://kcp-api-v2.adminkitchencostpro.workers.dev/api/gmail/oauth/callback"
GDRIVE_OAUTH_REDIRECT_URI = "https://kcp-api-v2.adminkitchencostpro.workers.dev/api/gdrive/oauth/callback"
# Shared Turnstile public site key for the main and admin login surfaces.
TURNSTILE_SITE_KEY = "0x4AAAAAADwZO_so4RnTHBV8"
ADMIN_TURNSTILE_MODE = "enforce"
APP_TURNSTILE_MODE = "enforce"
YOCO_V2_CAPTURE_ENABLED = "all"
YOCO_V2_QUEUE_ENABLED = "all"
YOCO_V2_ADMIN_ENABLED = "all"
YOCO_V2_LIVE_SALE_REPORTING = "all"
YOCO_V2_LIVE_SALE_STOCK = "all"
YOCO_V2_LIVE_REFUND_REPORTING = "all"
YOCO_V2_LIVE_REFUND_STOCK = "all"
# Pre-launch bypass. While the app is not live, set to "all" (or workspace IDs) to let the
# YOCO_V2_LIVE_* flags alone enable live consumption, skipping the per-workspace controlled
YOCO_V2_MAX_ATTEMPTS = "8"
YOCO_V2_BASE_RETRY_MS = "5000"
YOCO_V2_MAX_RETRY_MS = "900000"
YOCO_V2_API_TIMEOUT_MS = "15000"
# Conservative coordination delay only; this is not a documented Yoco rate limit.
YOCO_V2_REQUEST_SPACING_MS = "250"
YOCO_V2_ORDER_CACHE_TTL_MS = "30000"
YOCO_V2_REFUND_CACHE_TTL_MS = "20000"
YOCO_V2_METADATA_CACHE_TTL_MS = "60000"
YOCO_V2_AUTH_FAILURE_THRESHOLD = "2"
YOCO_V2_RATE_LIMIT_PAUSE_FALLBACK_MS = "30000"
YOCO_V2_RECONCILIATION_OVERLAP_MINUTES = "120"
YOCO_V2_RECONCILIATION_LOOKBACK_HOURS = "24"
# Deliberately below Cloudflare's real 100,000 writes/day account-wide cap — other work (admin
# actions, reporting, other crons) shares that same cap, so this leaves headroom rather than
# racing the real ceiling.
YOCO_V2_WRITE_BUDGET_DAILY_CAP = "90000"
YOCO_V2_WRITE_BUDGET_SOFT_WARN_RATIO = "0.8"
# Production secrets are configured with `wrangler secret put`; never store them here.

# Secrets to configure with `wrangler secret put`:
#   YOCO_KEY_ENCRYPTION_SECRET, GMAIL_* , GDRIVE_* , TURNSTILE_SECRET_KEY, etc.

# --- Yoco V2 isolated capture and processing queues ----------------------------------------------
[[queues.producers]]
binding = "YOCO_V2_EVENTS"
queue = "kcp-yoco-v2-events"

[[queues.producers]]
binding = "YOCO_V2_EVENTS_DLQ"
queue = "kcp-yoco-v2-events-dlq"

[[queues.consumers]]
queue = "kcp-yoco-v2-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 8
dead_letter_queue = "kcp-yoco-v2-events-dlq"
